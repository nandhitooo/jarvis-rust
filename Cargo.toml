[package]
name = "jarvis-rs"
version = "0.1.0"
edition = "2021"
rust-version = "1.99"

[dependencies]
tokio = { version = "1", features = ["full"] }
serenity = { version = "0.12", features = [
    "client",
    "gateway",
    "model",
    "cache",
    "voice",
    "http",
    "rustls_backend",
    "framework",
] }
poise = "0.6"
songbird = { version = "0.4", features = ["serenity", "rustls"] }
symphonia = { version = "0.5", features = ["mp3", "aac", "flac", "ogg", "vorbis", "wav"] }
reqwest = { version = "0.11", default-features = false, features = [
    "rustls-tls",
    "json",
    "stream",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dotenvy = "0.15"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
sysinfo = "0.33"
scraper = "0.22"
pdf-extract = "0.8"
anyhow = "1"
thiserror = "2"
